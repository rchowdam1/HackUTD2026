[project]
name = "safe-signal"
version = "0.1.0"
description = "Safe Signal: in-call scam-request alerts by SMS (HackUTD 2026)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "faster-whisper>=1.0",
    "twilio>=9.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9", # FastAPI form parsing for Twilio webhooks
    "pytest>=8.0",
]

[project.optional-dependencies]
# CPU-only torch (see [tool.uv.sources]); sentencepiece + protobuf for the DeBERTa-v3 tokenizer.
intent = ["transformers>=4.44", "torch>=2.4", "sentencepiece>=0.2", "protobuf>=4.25"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
