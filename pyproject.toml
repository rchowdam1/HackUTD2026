[project]
name = "safe-signal"
version = "0.1.0"
description = "CallSafe: in-call scam-request alerts by SMS (HackUTD 2026)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "faster-whisper>=1.0",
    "twilio>=9.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9", # FastAPI form parsing for Twilio webhooks
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
